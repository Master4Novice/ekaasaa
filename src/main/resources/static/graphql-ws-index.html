<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>GraphQL WebSocket</title>
    <script src="https://unpkg.com/react@17.0.2/umd/react.development.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@17.0.2/umd/react-dom.development.js" crossorigin="anonymous"></script>
    <script type="text/javascript" src="https://unpkg.com/graphql-ws@5.16.2/umd/graphql-ws.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.14/babel.min.js" crossorigin="anonymous"></script>
</head>
<body>
<script type="text/jsx">
    import 'ag-grid-community/styles/ag-grid.css';
    import 'ag-grid-community/styles/ag-theme-alpine.css';
    const app = document.getElementById('app');

    function UserInformation() {
       return <div>Data Table</div>
    }

    function UserDashBoard() {
       return <UserInformation />
    }

    ReactDOM.render(<UserDashBoard/>, app);
    const client = graphqlWs.createClient({
        url: (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/graphql',
    });

    // query
    (async () => {
        const result = await new Promise((resolve, reject) => {
            let result;
            client.subscribe(
                {
                    query: '{ getUsers{\n    id\n    firstName\n    middleName\n    lastName\n  }\n}',
                },
                {
                    next: (data) => (result = data),
                    error: reject,
                    complete: () => resolve(result),
                },
            );
        });

        console.log("Query result: " + result);
    })();

    // subscription
    (async () => {
        const onNext = (data) => {
            console.log("Subscription data:", data);
        };

        await new Promise((resolve, reject) => {
            client.subscribe(
                {
                    query: 'subscription { userSub{\n    id\n    firstName\n    middleName\n    lastName\n  }\n }',
                },
                {
                    next: onNext,
                    error: reject,
                    complete: resolve,
                },
            );
        });
    })();

</script>
<div id="app"></div>
</body>
</html>
